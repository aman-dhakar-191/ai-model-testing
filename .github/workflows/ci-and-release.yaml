name: CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1: Runs only on PR — validates the code builds
  dev-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

  # Job 2: Runs only on merge to main — builds for all 3 platforms
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run electron:build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            !release/**/elevate.exe
          retention-days: 7

  # Job 3: Runs after build — creates tag and release from package.json version
  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git describe and tag checks

      # Determines the next version:
      # - If current package.json version tag doesn't exist → use it as is
      # - If it already exists → look at commits since last tag and bump accordingly
      #     feat:  → minor (1.0.0 → 1.1.0)
      #     fix:   → patch (1.0.0 → 1.0.1)
      #     other: → patch (fallback)
      - name: Determine next version
        id: next-version
        run: |
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "============================="
          echo "📦 package.json version : $CURRENT_VERSION"
          echo "🏷️  Last existing tag    : ${LAST_TAG:-none}"
          echo "🔍 All tags             :"
          git tag -l
          echo "============================="

          # If no tag exists at all, use current version directly
          if [ -z "$LAST_TAG" ]; then
            echo "➡️  No tags found → using package.json version as is: v$CURRENT_VERSION"
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "bumped=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If current version tag doesn't exist yet, use it directly
          if ! git rev-parse --verify "v$CURRENT_VERSION" 2>/dev/null; then
            echo "➡️  Tag v$CURRENT_VERSION doesn't exist yet → using it as is"
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "bumped=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Tag already exists — need to auto-bump based on commits
          echo "⚠️  Tag v$CURRENT_VERSION already exists → auto-bumping"
          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s")

          echo "📝 Commits since $LAST_TAG:"
          echo "$COMMITS"
          echo "============================="

          # Check if any feat commit exists → minor bump
          if echo "$COMMITS" | grep -qi "^feat"; then
            BUMP=minor
          else
            BUMP=patch
          fi

          # Parse current version
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d'.' -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d'.' -f3)

          if [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "📈 Bump type            : $BUMP"
          echo "📦 Old version          : $CURRENT_VERSION"
          echo "✅ New version          : $NEW_VERSION"
          echo "============================="

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bumped=true" >> $GITHUB_OUTPUT

      # Updates package.json with the new version and pushes to main
      - name: Update package.json version
        if: steps.next-version.outputs.bumped == 'true'
        run: |
          NEW_VERSION=${{ steps.next-version.outputs.version }}
          echo "📝 Writing version $NEW_VERSION to package.json"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes from commits
        id: release-notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          NEW_VERSION=${{ steps.next-version.outputs.version }}
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --format="- %h %s (%an)" --reverse)
          else
            COMMITS=$(git log "$LAST_TAG"..HEAD --format="- %h %s (%an)" --reverse)
          fi
          FEAT=$(echo "$COMMITS" | grep -i "^- [a-f0-9]* feat" || true)
          FIX=$(echo "$COMMITS" | grep -i "^- [a-f0-9]* fix" || true)
          CHORE=$(echo "$COMMITS" | grep -i "^- [a-f0-9]* chore" || true)
          DOCS=$(echo "$COMMITS" | grep -i "^- [a-f0-9]* docs" || true)
          OTHER=$(echo "$COMMITS" | grep -vi "^- [a-f0-9]* \(feat\|fix\|chore\|docs\)" || true)
          NOTES="## Release v$NEW_VERSION\n\n"
          if [ -n "$FEAT" ]; then
            NOTES+="### ✨ Features\n$FEAT\n\n"
          fi
          if [ -n "$FIX" ]; then
            NOTES+="### 🐛 Bug Fixes\n$FIX\n\n"
          fi
          if [ -n "$DOCS" ]; then
            NOTES+="### 📝 Documentation\n$DOCS\n\n"
          fi
          if [ -n "$CHORE" ]; then
            NOTES+="### 🔧 Chores\n$CHORE\n\n"
          fi
          if [ -n "$OTHER" ]; then
            NOTES+="### 📦 Other\n$OTHER\n\n"
          fi
          echo -e "$NOTES" > release_notes.md
          cat release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.next-version.outputs.version }}
          name: Release v${{ steps.next-version.outputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.tar.gz
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
